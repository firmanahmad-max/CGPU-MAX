# Render Blueprint — API only.
# Stack split: web → Vercel, Postgres → Neon, Redis → off. This deploys just the
# Express API as a Docker web service. Fill the two `sync: false` values in the
# Render dashboard (see docs/DEPLOY.md). You provide the Render account.
services:
  - type: web
    name: cgpu-max-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free # free web services cold-start after ~15 min idle
    region: singapore # nearest to Indonesia; change if you like
    healthCheckPath: /health
    # Free tier doesn't allow preDeployCommand, so sync schema + seed at startup
    # instead (both idempotent), then start the server. Needs a DIRECT
    # (non-pooled) Neon URL so `prisma db push` works. Drop the seed for a real
    # dataset.
    dockerCommand: 'sh -c "pnpm exec prisma db push --skip-generate && pnpm exec tsx prisma/seed.ts && node dist/index.js"'
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_ENABLED
        value: 'false' # no Redis in this setup; caching/rate-limit become no-ops
      - key: DATABASE_URL
        sync: false # Neon connection string (use the DIRECT one — see DEPLOY.md)
      - key: CORS_ALLOWED_ORIGINS
        sync: false # your Vercel URL, e.g. https://cgpu-max.vercel.app
