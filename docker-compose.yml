services:
  postgres:
    image: postgres:15-alpine
    container_name: cgpu-max-postgres
    environment:
      POSTGRES_DB: cgpu_max
      POSTGRES_USER: cgpu_user
      POSTGRES_PASSWORD: cgpu_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cgpu_user -d cgpu_max']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cgpu-max-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cgpu-max-api
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cgpu_user:cgpu_password@postgres:5432/cgpu_max
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: cgpu-max-web
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api

  scraper:
    build:
      context: .
      dockerfile: services/scraper/Dockerfile
    container_name: cgpu-max-scraper
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cgpu_user:cgpu_password@postgres:5432/cgpu_max
      REDIS_URL: redis://redis:6379
      SCRAPER_CRON: '0 */6 * * *'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
